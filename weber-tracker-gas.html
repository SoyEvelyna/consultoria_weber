<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weber Tracker</title>
</head>
<body>
<style>
:root{
  --paper:#FAFAFA; --card:#FFFFFF; --ink:#212121; --chrome:#FEF200; --hazard:#F03E24;
  --signal:#50E661; --sky:#6BB1BD; --muted:#6B6B6B; --rule:#DCDCDC;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --switzer:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --micro:11px; --tracking-micro:.12em; --tracking-display:-.03em;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:light}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
img{display:block;max-width:100%}
button,select,input,textarea{font-family:inherit;color:inherit}
.cond{font-weight:900;text-transform:uppercase;font-stretch:condensed;letter-spacing:var(--tracking-display);line-height:.9}
.sw{font-family:var(--switzer);font-weight:700}
.micro{font-size:var(--micro);letter-spacing:var(--tracking-micro);text-transform:uppercase;font-weight:600}
.mono-num{font-variant-numeric:tabular-nums}
a{color:inherit}

/* ===== APP SHELL ===== */
#app{max-width:1240px;margin:0 auto;padding:20px 24px 80px}
@media (max-width:720px){ #app{padding:14px 14px 60px} }

/* ===== TOPBAR ===== */
.topbar{
  display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;
  border-bottom:3px solid var(--ink); padding-bottom:20px; margin-bottom:18px;
}
.brandmark{width:min(150px,32vw);flex:none;padding-bottom:4px}
.brandmark svg{width:100%;height:auto;display:block}
.topbar .id-block{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-width:0;max-width:100%}
.topbar .id-block .micro{color:var(--muted)}
.topbar h1{font-size:clamp(34px,6vw,58px)}
.service-tag{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  border:2px solid var(--ink);padding:6px 12px;display:block;max-width:100%;box-sizing:border-box;
}
@media (min-width:640px){ .service-tag{display:inline-block;max-width:290px} }
.topbar .meta-block{
  margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px;
}
.stage-pill{
  font-size:var(--micro);letter-spacing:var(--tracking-micro);text-transform:uppercase;font-weight:700;
  border:2px solid var(--ink); padding:7px 14px; background:var(--paper);
}
.sync-chip{display:flex;align-items:center;gap:7px;font-size:var(--micro);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync-dot.-on{background:var(--signal)}
.sync-dot.-local{background:var(--chrome)}

/* ===== TABS ===== */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);margin-bottom:28px;overflow-x:auto}
.tab-btn{
  appearance:none;border:none;background:none;cursor:pointer;
  font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  padding:14px 18px 12px;border-bottom:4px solid transparent;color:var(--muted);white-space:nowrap;
}
.tab-btn:hover{color:var(--ink)}
.tab-btn.-active{color:var(--ink);border-bottom-color:var(--signal)}
.tab-btn:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}

/* ===== SECTION HEADINGS ===== */
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.view-head h2{font-size:clamp(26px,4vw,40px)}
.view-head .sub{color:var(--muted);font-size:15px;max-width:56ch;margin-top:6px}

/* ===== KPI GRID ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:var(--ink);border:2px solid var(--ink);margin-bottom:28px}
.kpi{background:var(--card);padding:18px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kpi.-accent{background:var(--signal)}
.kpi.-warn{background:var(--hazard);color:var(--paper)}
.kpi .num{font-family:var(--sans);font-weight:900;font-stretch:condensed;font-size:clamp(28px,3.4vw,44px);line-height:1}
.kpi .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.kpi.-accent .lbl,.kpi.-warn .lbl{color:inherit;opacity:.82}
@media (max-width:920px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}

/* ===== ESTADO GENERAL BANNER ===== */
.status-banner{
  display:flex;align-items:center;gap:14px;border:2px solid var(--ink);padding:16px 20px;margin-bottom:28px;background:var(--card);
}
.status-banner .dot{width:14px;height:14px;flex:none;background:var(--signal)}
.status-banner.-warn .dot{background:var(--chrome)}
.status-banner.-risk .dot{background:var(--hazard)}
.status-banner .txt b{font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.status-banner .txt span{display:block;color:var(--muted);font-size:13px;margin-top:2px}

/* ===== FASE PROGRESS ROW ===== */
.fase-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px}
@media (max-width:820px){.fase-row{grid-template-columns:repeat(2,1fr)}}
.fase-card{border:2px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.fase-card .flabel{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1.25;min-height:2.4em}
.fase-card .fsub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.fase-bar{height:10px;background:var(--paper);border:1.5px solid var(--ink);position:relative;overflow:hidden}
.fase-bar i{display:block;height:100%;background:var(--signal)}
.fase-nums{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.fase-nums b{color:var(--ink)}

/* ===== OBJETIVO / PRIORIDADES BLOCK ===== */
.strategy-block{border:2px solid var(--ink);margin-bottom:32px;background:var(--card)}
.strategy-block .obj-head{padding:22px 24px;border-bottom:2px solid var(--ink);background:var(--chrome)}
.strategy-block .obj-head .micro{color:var(--ink);opacity:.7}
.strategy-block .obj-head p{font-size:17px;line-height:1.4;max-width:80ch;margin-top:8px;font-weight:500}
.prio-list{display:grid;grid-template-columns:repeat(3,1fr)}
@media (max-width:820px){.prio-list{grid-template-columns:1fr}}
.prio-item{padding:20px 22px;border-right:2px solid var(--ink)}
.prio-item:last-child{border-right:none}
@media (max-width:820px){.prio-item{border-right:none;border-bottom:2px solid var(--ink)}.prio-item:last-child{border-bottom:none}}
.prio-item .n{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.prio-item h4{font-size:16px;text-transform:uppercase;margin:6px 0 8px;letter-spacing:-.01em}
.prio-item p{font-size:13.5px;line-height:1.5;color:var(--muted)}

/* ===== FILTER BAR ===== */
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px;padding:14px;border:2px solid var(--ink);background:var(--card)}
.filter-bar .fgroup{display:flex;flex-direction:column;gap:4px}
.filter-bar label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.filter-bar select{
  border:2px solid var(--ink);background:var(--paper);padding:8px 30px 8px 10px;font-size:12.5px;
  text-transform:uppercase;letter-spacing:.03em;font-weight:600;appearance:none;cursor:pointer;min-width:150px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23212121'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;
}
.filter-bar select:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.filter-clear{
  margin-left:auto;background:none;border:2px solid transparent;text-decoration:underline;
  font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;cursor:pointer;padding:8px 4px;color:var(--muted);
}
.filter-clear:hover{color:var(--hazard)}
.result-count{font-size:12px;color:var(--muted);margin-bottom:14px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}

/* ===== FASE GROUP HEADER (plan view) ===== */
.group-head{
  display:flex;align-items:center;gap:12px;margin:30px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--ink);
}
.group-head:first-child{margin-top:0}
.group-head h3{font-size:19px;text-transform:uppercase;letter-spacing:-.01em}
.group-head .count{font-size:12px;color:var(--muted);font-weight:700}
.group-head .swatch{width:14px;height:14px;flex:none;background:var(--signal)}

/* ===== TASK LIST ===== */
.task-list{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.task-row{
  display:grid;grid-template-columns:1.15fr 1.9fr 108px 140px 152px 34px;gap:14px;align-items:center;
  padding:13px 4px;border-bottom:1.5px solid var(--rule);
}
.task-row:hover{background:rgba(33,33,33,.03)}
.task-row.-overdue{background:rgba(240,62,36,.06)}
@media (max-width:980px){
  .task-row{grid-template-columns:1fr;gap:8px;padding:14px 4px}
  .task-row .col-dates,.task-row .col-resp{justify-self:start}
}
.tk-tema{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:3px}
.tk-tarea{font-size:14.5px;line-height:1.35;font-weight:500}
.tk-flags{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}
.flag{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1.5px solid var(--hazard);color:var(--hazard)}
.resp-chip{
  width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;
  font-size:10.5px;font-weight:800;background:var(--card);flex:none;
}
.col-resp{display:flex;align-items:center;gap:8px}
.col-resp .rname{font-size:11.5px;color:var(--muted);font-weight:600}
.col-dates{font-size:11.5px;color:var(--muted);line-height:1.5;font-weight:500}
.col-dates b{color:var(--ink);font-weight:700}
.urg-dot{width:9px;height:9px;flex:none;background:var(--muted);margin-right:6px;display:inline-block}
.urg-Alta{background:var(--hazard)}
.urg-Media{background:var(--chrome)}
.urg-Baja{background:var(--rule)}
.status-select{
  border:2px solid var(--ink);padding:7px 24px 7px 10px;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.03em;appearance:none;cursor:pointer;width:100%;
  background-repeat:no-repeat;background-position:right 8px center;background-size:9px 6px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23212121'/></svg>");
}
.st-Por-hacer{background:var(--paper);color:var(--ink)}
.st-En-proceso{background:var(--sky);color:var(--ink)}
.st-En-revisión{background:var(--chrome);color:var(--ink)}
.st-Completado{background:var(--signal);color:var(--ink)}
.st-Bloqueado{background:var(--hazard);color:var(--paper)}
.obs-btn{
  width:30px;height:30px;border:2px solid var(--ink);background:var(--card);cursor:pointer;
  display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;
}
.obs-btn:hover{background:var(--ink);color:var(--paper)}
.obs-btn[disabled]{opacity:.25;cursor:default}
.obs-btn[disabled]:hover{background:var(--card);color:var(--ink)}
.empty-note{padding:36px 8px;text-align:center;color:var(--muted);font-size:14px;border-bottom:1.5px solid var(--rule)}

/* ===== TIMELINE ===== */
.tl-month{margin-bottom:8px}
.tl-month-head{
  position:sticky;top:0;background:var(--paper);z-index:1;
  font-size:13px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;
  padding:10px 0;border-bottom:2px solid var(--ink);margin-bottom:2px;
}
.tl-item{display:flex;gap:16px;padding:12px 0;border-bottom:1.5px solid var(--rule)}
.tl-date{width:66px;flex:none;font-size:12px;font-weight:800;color:var(--muted);padding-top:2px}
.tl-node{width:12px;flex:none;display:flex;justify-content:center;padding-top:5px}
.tl-node i{width:12px;height:12px;background:var(--ink);display:block}
.tl-node i.-done{background:var(--signal)}
.tl-node i.-overdue{background:var(--hazard)}
.tl-body{flex:1;min-width:0}
.tl-body .tt{font-size:14.5px;font-weight:600;line-height:1.35}
.tl-body .tm{font-size:11.5px;color:var(--muted);margin-top:3px}

/* ===== PENDIENTES ===== */
.pend-section{margin-bottom:34px}
.pend-section h3{font-size:18px;text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.pend-section h3 .tag-count{background:var(--ink);color:var(--paper);font-size:12px;padding:2px 9px;font-weight:700}
.pend-card{border:2px solid var(--ink);padding:14px 16px;margin-bottom:10px;background:var(--card);display:flex;gap:14px;align-items:flex-start}
.pend-card.-hazard{border-color:var(--hazard)}
.pend-card .body{flex:1;min-width:0}
.pend-card .tt{font-size:14px;font-weight:600;line-height:1.35}
.pend-card .mt{font-size:11.5px;color:var(--muted);margin-top:5px}
.backlog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.backlog-item{border:1.5px dashed var(--ink);padding:12px 14px;font-size:13px;line-height:1.4}
.backlog-item .bl-area{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:4px}
.backlog-item .bl-fase{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;border:1.5px solid var(--rule);padding:1px 6px;color:var(--muted)}

/* ===== ENTREGABLES ===== */
.deliv-grid{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.deliv-row{display:grid;grid-template-columns:26px 1.4fr 1.6fr 130px 120px;gap:14px;align-items:center;padding:13px 4px;border-bottom:1.5px solid var(--rule)}
@media (max-width:900px){.deliv-row{grid-template-columns:1fr}}
.deliv-icon{width:26px;height:26px;background:var(--ink);color:var(--chrome);display:grid;place-items:center;font-size:12px;font-weight:800}
.deliv-name{font-size:14px;font-weight:600;line-height:1.35}
.deliv-task{font-size:12.5px;color:var(--muted);line-height:1.4}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1.5px solid var(--ink);padding:4px 9px;width:fit-content}

/* ===== NOTAS ===== */
.notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
@media (max-width:900px){.notes-grid{grid-template-columns:1fr}}
.note-compose{border:2px solid var(--ink);padding:16px;background:var(--card);margin-bottom:18px}
.note-compose textarea{
  width:100%;border:2px solid var(--ink);padding:10px;font-size:14px;font-family:inherit;resize:vertical;min-height:70px;background:var(--paper);
}
.note-compose .row{display:flex;gap:10px;margin-top:10px;align-items:center}
.note-compose select{border:2px solid var(--ink);padding:8px;font-size:12px;text-transform:uppercase;font-weight:700;background:var(--paper)}
.btn-primary{
  background:var(--ink);color:var(--chrome);border:2px solid var(--ink);padding:10px 20px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;font-size:12.5px;cursor:pointer;
}
.btn-primary:hover{background:var(--hazard);border-color:var(--hazard);color:var(--paper)}
.btn-primary:disabled{opacity:.4;cursor:default;background:var(--muted);border-color:var(--muted)}
.note-item{border-left:4px solid var(--ink);padding:10px 0 10px 14px;margin-bottom:14px}
.note-item .who{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.note-item .when{font-weight:500;text-transform:none;letter-spacing:0}
.note-item p{font-size:14px;line-height:1.5;margin-top:4px}

/* ===== MODAL ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(33,33,33,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-backdrop[hidden]{display:none}
.modal-box{background:var(--paper);border:2px solid var(--ink);max-width:480px;width:100%;padding:24px;max-height:80vh;overflow:auto}
.modal-box h3{font-size:20px;text-transform:uppercase;margin-bottom:14px;padding-right:30px}
.modal-box .mrow{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1.5px solid var(--rule);font-size:13.5px}
.modal-box .mrow:first-of-type{border-top:none}
.modal-box .mrow .k{color:var(--muted);font-weight:600;flex:none;width:110px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;line-height:1}
.modal-wrap{position:relative}

/* ===== FORM FIELDS (modal add-task / add-meeting) ===== */
.field{margin-bottom:14px}
.field label.flabel{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input[type="text"],.field input[type="url"],.field input[type="date"],.field input[type="email"],.field input[type="password"],.field select,.field textarea{
  width:100%;border:2px solid var(--ink);padding:9px 10px;font-size:13.5px;background:var(--paper);font-family:inherit;
}
.field textarea{resize:vertical;min-height:64px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.field-row{grid-template-columns:1fr}}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.btn-secondary{
  background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:10px 20px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;font-size:12.5px;cursor:pointer;
}
.btn-secondary:hover{background:var(--rule)}
.btn-danger{
  background:var(--paper);color:var(--hazard);border:2px solid var(--hazard);padding:10px 20px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;font-size:12.5px;cursor:pointer;
}
.btn-danger:hover{background:var(--hazard);color:var(--paper)}
.btn-sm{padding:9px 14px;font-size:11px}
.link-inline{display:flex;gap:8px;align-items:stretch}
.link-inline input{flex:1}
.view-head .actions{display:flex;gap:10px}
a.deliv-link,a.entregable-link{color:var(--ink);text-decoration:underline;text-decoration-color:var(--signal);text-underline-offset:2px}
a.deliv-link:hover,a.entregable-link:hover{color:var(--hazard);text-decoration-color:var(--hazard)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.custom-tag{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1.5px solid var(--sky);color:var(--ink);background:var(--sky);margin-left:8px;vertical-align:middle}

/* ===== REUNIONES ===== */
.meeting-compose{border:2px solid var(--ink);padding:16px;background:var(--card);margin-bottom:24px}
.meeting-item{border:2px solid var(--ink);padding:14px 16px;margin-bottom:10px;background:var(--card)}
.meeting-item.-historical{border-style:dashed;background:transparent}
.meeting-item .mhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.meeting-item .mdate{font-size:15px;font-weight:800}
.meeting-item .mmeta{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.meeting-item .mbody{font-size:13.5px;line-height:1.5;margin-top:8px;color:var(--ink)}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
::selection{background:var(--ink);color:var(--chrome)}

.row-delete{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.row-delete:hover{color:var(--hazard)}
.note-item,.meeting-item{position:relative}
.note-item .row-delete,.meeting-item .row-delete{position:absolute;top:0;right:0}
</style>

<div id="app">
  <header class="topbar">

function normEstado(raw){
  if(!raw) return "Por hacer";
  const s = raw.trim().toLowerCase();
  if(s.startsWith("final")) return "Completado";
  if(s.startsWith("en proceso")) return "En proceso";
  if(s.startsWith("actualiz")) return "En proceso";
  if(s.startsWith("revis")) return "En revisión";
  if(s.startsWith("propuesta")) return "En revisión";
  return "Por hacer";
}
function classifyFase(t){
  const s = ((t.tema||"")+" "+(t.tarea||"")+" "+(t.area||"")).toLowerCase();
  const has = arr => arr.some(k=>s.includes(k));
  if(has(["cliente potenc","evento","oilgas","chatgpt","expo-logisti","leads","comexnp","competencia","vender","funnel","vaca muerta","infopymes","seguidores","contactar"])) return 3;
  if(has(["brand nuevo","logo","redes sociales","whatsapp","email marketing","google my business","instagram","registro de marca","carpeta institucional","membretada","firma de email","web nueva","web:","web I","lanzamiento","landing","identidad visual"])) return 1;
  return 2;
}
const RESP_INITIALS = {"Eve":"EV","Ger":"GE","Fer":"FE","Ari":"AR","Loopa":"LO","Supervisores":"SU","Equipo":"EQ"};
function initials(r){
  if(!r) return "—";
  if(RESP_INITIALS[r]) return RESP_INITIALS[r];
  const parts = r.trim().split(/\s+/);
  return (parts.length>1 ? parts[0][0]+parts[1][0] : r.slice(0,2)).toUpperCase();
}
function respLabel(r){ return r || "Sin asignar"; }
function allResponsables(){
  const set = new Set(RESPONSABLES);
  customTasksState.forEach(c=>{ if(c.responsable) set.add(c.responsable); });
  return Array.from(set);
}
function toHref(s){ const v=s.trim(); return /^https?:\/\//i.test(v) ? v : "https://"+v; }
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("es-AR",{day:"2-digit",month:"short"}).replace(".","");
}
function fmtDateLong(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("es-AR",{day:"2-digit",month:"long",year:"numeric"});
}
function todayMidnight(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function dueDateOf(t){ return t.cierre || t.tiempo || t.inicio || null; }
function isOverdue(t, estado){
  if(estado==="Completado") return false;
  const due = dueDateOf(t);
  if(!due) return false;
  return new Date(due+"T00:00:00") < todayMidnight();
}
function urgencia(t, estado){
  if(estado==="Completado") return "Baja";
  if(estado==="Bloqueado") return "Alta";
  const due = dueDateOf(t);
  if(!due) return "Baja";
  const days = Math.round((new Date(due+"T00:00:00") - todayMidnight())/86400000);
  if(days < 0) return "Alta";
  if(days <= 10) return "Alta";
  if(days <= 25) return "Media";
  return "Baja";
}

/* El id se deriva del contenido (no de la posición) para que los estados,
   fechas y links guardados sigan apuntando a la misma tarea cuando se
   vuelven a importar los datos del Sheet con filas nuevas o reordenadas. */
let idSeen = {};
function hashId(str){
  let h = 5381;
  for(let i=0;i<str.length;i++) h = (((h<<5)+h) ^ str.charCodeAt(i)) >>> 0;
  return "t"+h.toString(36);
}
function mk(base, source, fase){
  const key = [source, base.area||"", base.tema||"", base.tarea||""].join("|");
  idSeen[key] = (idSeen[key]||0) + 1;
  const id = hashId(key + "#" + idSeen[key]);
  const estadoOriginal = base.estado || null;
  return Object.assign({id, source, fase: fase!==undefined?fase:classifyFase(base), estadoOriginal}, base);
}
let TASKS = [];
function rebuildTasks_(){
  idSeen = {};
  TASKS = [];
  RAW.etapa1.forEach(e=>{
    TASKS.push(mk({area:"Proceso", tema:"Diagnóstico y estrategia", tarea:e.tarea, responsable:e.responsable,
      inicio:e.fecha, tiempo:e.fecha, cierre:e.fecha, estado:e.estado, obs:e.resultado}, "etapa1", 0));
  });
  RAW.iniciativas.forEach(t=> TASKS.push(mk(t, "iniciativa")));
  RAW.finalizados.forEach(t=> TASKS.push(mk(t, "finalizado")));
  RAW.backlog.forEach(str=>{
    const parts = str.split(" I ").map(s=>s.trim());
    const area = parts[0];
    let tema = null, desc = parts.slice(1).join(" I ");
    if(parts.length >= 3){ tema = parts[1]; desc = parts.slice(2).join(" I "); }
    const faseMatch = desc.match(/Fase\s*(\d)/i);
    const subfase = faseMatch ? "Fase "+faseMatch[1] : null;
    const descClean = desc.replace(/Fase\s*\d\s*[·.]?\s*/i,"").trim();
    const tarea = tema ? (tema+" — "+descClean) : descClean;
    TASKS.push(mk({area, tema, tarea, subfase, responsable:null, inicio:null, tiempo:null, cierre:null, estado:null, obs:null}, "backlog"));
  });
}
rebuildTasks_(); // construye TASKS a partir de RAW, incluido en este archivo

async function patchSeedOverride(taskId, patch){
  overridesState[taskId] = Object.assign({}, overridesState[taskId], patch);
  render();
  if(dbMode==="live" && overridesDoc){
    const payload = {tasks:{}};
    payload.tasks[taskId] = Object.assign({}, patch, {updatedAt:new Date().toISOString()});
    try{ await overridesDoc.update(payload); }
    catch(e){ try{ await overridesDoc.set(payload); }catch(e2){ console.error(e2); } }
  } else {
    saveLocalOverrides();
  }
}

async function patchCustomTask(taskId, patch){
  const idx = customTasksState.findIndex(c=>c.id===taskId);
  if(idx>=0) customTasksState[idx] = Object.assign({}, customTasksState[idx], patch);
  render();
  if(dbMode==="live" && customCol){
    try{ await customCol.doc(taskId).update(patch); }catch(e){ console.error(e); }
  } else {
    saveLocalCustom();
  }
}

  if(t.source==="custom") return patchCustomTask(t.id, {estado});
  return patchSeedOverride(t.id, {estado});

  const value = link && link.trim() ? link.trim() : null;
  if(t.source==="custom") return patchCustomTask(t.id, {link:value});

/* =====================================================================
   APPS SCRIPT ADAPTER
   Implementa la misma interfaz que la db capability de arriba
   (doc/collection/onSnapshot), respaldada por un Web App de Google Apps
   Script que lee y escribe en el Google Sheet.

   - UNA sola lectura al abrir la página: trae en el mismo request las
     tareas base (leídas en vivo de "01"/"02") y lo editable desde la web.
   - Escribe solo cuando el usuario crea, edita o borra algo.
   - Sin polling, sin triggers, sin pestañas espejo.
   ===================================================================== */
const GAS_CFG = window.WEBER_GAS_CONFIG || {};
let gasData = null; // snapshot leído al abrir

function gasConfigured(){
  return !!(GAS_CFG.url && GAS_CFG.token && !/YOUR-/.test(GAS_CFG.url + GAS_CFG.token));
}

async function gasRead_(){
  const sep = GAS_CFG.url.indexOf("?")>=0 ? "&" : "?";
  const res = await fetch(GAS_CFG.url + sep + "action=read&token=" + encodeURIComponent(GAS_CFG.token));
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || "error leyendo el Sheet");
  return json;
}

/* Content-Type por defecto (text/plain) a propósito: evita el preflight
   CORS, que los Web Apps de Apps Script no responden. */
async function gasWrite_(action, payload){
  const res = await fetch(GAS_CFG.url, {
    method: "POST",
    body: JSON.stringify({token: GAS_CFG.token, action: action, payload: payload})
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || ("error en "+action));
  return json.result;
}

/* Reemplaza las tareas base por las que vienen del Sheet. */
function gasApplySeed_(seed){
  if(!seed) return;
  RAW.etapa1 = seed.etapa1 || [];
  RAW.iniciativas = seed.iniciativas || [];
  RAW.finalizados = seed.finalizados || [];
  RAW.backlog = seed.backlog || [];
  if(seed.objetivo) OBJETIVO = seed.objetivo;
  if(seed.prioridades && seed.prioridades.length) PRIORIDADES = seed.prioridades;
  rebuildTasks_();
}

function gasOverridesDoc_(){
  return {
    async update(payload){
      const patch = (payload && payload.tasks) || {};
      for(const taskId of Object.keys(patch)){
        await gasWrite_("setOverride", {taskId: taskId, patch: patch[taskId] || {}});
      }
    },
    async set(payload){ return this.update(payload); },
    onSnapshot(cb){
      cb({exists:true, data: ()=> ({tasks: (gasData && gasData.overrides) || {}})});
    }
  };
}

const GAS_COLLECTIONS = {
  notes:       {key:"notes",       add:"addNote",        update:null,                del:"deleteNote"},
  customTasks: {key:"customTasks", add:"addCustomTask",  update:"updateCustomTask",  del:"deleteCustomTask"},
  meetings:    {key:"meetings",    add:"addMeeting",     update:null,                del:"deleteMeeting"}
};

function gasCollection_(name){
  const cfg = GAS_COLLECTIONS[name];
  const ref = {
    doc(id){
      return {
        async set(data){ await gasWrite_(cfg.add, Object.assign({}, data, {id: id})); },
        async update(patch){ if(cfg.update) await gasWrite_(cfg.update, {id: id, patch: patch}); },
        async delete(){ await gasWrite_(cfg.del, {id: id}); }
      };
    },
    orderBy(){ return ref; },
    limit(){ return ref; },
    onSnapshot(cb){
      cb({docs: ((gasData && gasData[cfg.key]) || []).map(row=>({data: ()=> row}))});
    }
  };
  return ref;
}

async function initGasStore_(){
  if(!gasConfigured()) return null;
  try{
    gasData = await gasRead_();
  }catch(e){ console.error("Apps Script no disponible:", e); return null; }
  gasApplySeed_(gasData.seed);
  return {
    doc(path){
      if(path==="board/overrides") return gasOverridesDoc_();
      throw new Error("doc path no soportado: "+path);
    },
    collection(name){
      if(!GAS_COLLECTIONS[name]) throw new Error("collection no soportada: "+name);
      return gasCollection_(name);
    }
  };
}

async function initStore(){
  loadLocal();
  try{
    if(window.claude && typeof window.claude.use === "function"){
      dbNs = await window.claude.use("db");
    }
  }catch(e){ dbNs = null; }
  if(!dbNs){
    try{ dbNs = await initGasStore_(); }
    catch(e){ console.error("Error inicializando Apps Script:", e); dbNs = null; }
  }
  if(!dbNs){ setSyncUI("local"); render(); return; }
  overridesDoc = dbNs.doc("board/overrides");
  notesCol = dbNs.collection("notes");
  customCol = dbNs.collection("customTasks");
  meetingsCol = dbNs.collection("meetings");
  setSyncUI("live");
  overridesDoc.onSnapshot(snap=>{
    const data = snap.exists ? snap.data() : null;
    overridesState = (data && data.tasks) || {};
    render();
  }, err=>{ console.error(err); setSyncUI("local"); render(); });
  notesCol.orderBy("createdAt","desc").limit(200).onSnapshot(snap=>{
    notesState = snap.docs.map(d=>d.data());
    render();
  }, err=>{ console.error(err); });
  customCol.onSnapshot(snap=>{
    customTasksState = snap.docs.map(d=>d.data()).sort((a,b)=> (b.createdAt||"").localeCompare(a.createdAt||""));
    render();
  }, err=>{ console.error(err); });
  meetingsCol.orderBy("fecha","desc").limit(300).onSnapshot(snap=>{
    meetingsState = snap.docs.map(d=>d.data());
    render();
  }, err=>{ console.error(err); });
}

function currentEstado(t){
  if(t.source==="custom") return t.estado || "Por hacer";
  const ov = overridesState[t.id];
  if(ov && ov.estado) return ov.estado;
  return normEstado(t.estadoOriginal);
}
function taskLink(t){
  if(t.source==="custom") return t.link || null;
  const ov = overridesState[t.id];
  return (ov && ov.link) || null;
}

/* =====================================================================
   ESTADO DE FILTROS Y VISTA
   ===================================================================== */
const state = { view:"dashboard", filters:{fase:"", estado:"", responsable:"", prioridad:""} };
const VIEWS = [
  {id:"dashboard", label:"Dashboard"},
  {id:"plan", label:"Plan de trabajo"},
  {id:"timeline", label:"Timeline"},
  {id:"reuniones", label:"Reuniones"},
  {id:"pendientes", label:"Pendientes"},
  {id:"entregables", label:"Entregables"},
  {id:"notas", label:"Notas"},
];
const ESTADOS = ["Por hacer","En proceso","En revisión","Completado","Bloqueado"];
const RESPONSABLES = ["Eve","Ger","Fer","Ari","Loopa","Supervisores","Equipo"];

function trackedTasks(){
  const seed = TASKS.filter(t=>t.source!=="etapa1")
    .filter(t=>{ const ov = overridesState[t.id]; return !(ov && ov.hidden); })
    .map(t=>{
      const ov = overridesState[t.id];
      if(!ov || (ov.inicio===undefined && ov.cierre===undefined)) return t;
      const merged = Object.assign({}, t);
      if(ov.inicio!==undefined) merged.inicio = ov.inicio;
      if(ov.cierre!==undefined) merged.cierre = ov.cierre;
      return merged;
    });
  return seed.concat(customTasksState.map(customAsTask));
}

function applyFilters(list){
  const f = state.filters;
  return list.filter(t=>{
    if(f.fase!=="" && String(t.fase)!==f.fase) return false;
    if(f.estado!=="" && currentEstado(t)!==f.estado) return false;
    if(f.responsable!==""){
      if(f.responsable==="__none__"){ if(t.responsable) return false; }
      else if(t.responsable!==f.responsable) return false;
    }
    if(f.prioridad!=="" && urgencia(t, currentEstado(t))!==f.prioridad) return false;
    return true;
  });
}

function renderTabs(){
  const nav = document.getElementById("tabs");

  });
}

      <textarea id="mt-resumen" placeholder="Ej: repasamos el lanzamiento de brand, quedó pendiente confirmar fecha con el cliente…"></textarea>
    </div>
    <button class="btn-primary" id="mt-submit">Guardar reunión</button>
  `;
  root.appendChild(compose);
  compose.querySelector("#mt-submit").addEventListener("click", ()=>{
    const fecha = compose.querySelector("#mt-fecha").value;
    const duracion = compose.querySelector("#mt-duracion").value.trim();
    const responsable = compose.querySelector("#mt-responsable").value.trim();
    const resumen = compose.querySelector("#mt-resumen").value.trim();
    if(!fecha || !resumen) return;
    addMeeting({fecha, duracion, responsable, resumen});
    compose.querySelector("#mt-resumen").value = "";
  });

  const combined = [];
  RAW.etapa1.forEach(e=> combined.push({fecha:e.fecha, responsable:e.responsable, duracion:null, resumen:e.tarea+(e.resultado?" — "+e.resultado:""), historical:true}));
  meetingsState.forEach(m=> combined.push(Object.assign({historical:false}, m)));
  combined.sort((a,b)=> (b.fecha||"").localeCompare(a.fecha||"") || (b.createdAt||"").localeCompare(a.createdAt||""));

  const log = document.createElement("div");
  combined.forEach(m=>{
    const item = document.createElement("div");
    item.className = "meeting-item" + (m.historical ? " -historical" : "");
    item.innerHTML = `
      ${m.historical?"":'<button class="row-delete" aria-label="Eliminar reunión">&times;</button>'}
      <div class="mhead">
        <span class="mdate">${fmtDateLong(m.fecha)}</span>
        <span class="mmeta">${m.duracion?m.duracion+" · ":""}${respLabel(m.responsable)}${m.historical?" · Etapa 1":""}</span>
      </div>
      <div class="mbody"></div>
    `;
    item.querySelector(".mbody").textContent = m.resumen || "";
    if(!m.historical){
      item.querySelector(".row-delete").addEventListener("click", ()=>{
        if(confirm("¿Eliminar esta reunión?")) deleteMeeting(m.id);
      });
    }
    log.appendChild(item);
  });
  root.appendChild(log);
}

/* =====================================================================
   RENDER: PENDIENTES
   ===================================================================== */
function renderPendientes(root){
  root.innerHTML = `<div class="view-head"><div>
      <h2 class="cond">Pendientes</h2>
      <p class="sub">Lo que está bloqueado, atrasado, o todavía no arrancó — para saber qué necesita una decisión o una acción.</p>
    </div></div>`;

  const tasks = trackedTasks();
  const withEstado = tasks.map(t=>({t, estado:currentEstado(t)}));
  const bloqueadas = withEstado.filter(x=>x.estado==="Bloqueado");
  const atrasadas = withEstado.filter(x=>isOverdue(x.t,x.estado) && x.estado!=="Bloqueado");
  const porHacerConFecha = withEstado.filter(x=>x.estado==="Por hacer" && !isOverdue(x.t,x.estado) && dueDateOf(x.t));

  function section(title, list, cls){
    const sec = document.createElement("div");
    sec.className = "pend-section";
    sec.innerHTML = `<h3>${title}<span class="tag-count">${list.length}</span></h3>`;
    if(list.length===0){
      sec.innerHTML += `<div class="empty-note">Nada por acá — todo en orden.</div>`;
    } else {
      list.forEach(x=>{
        const card = document.createElement("div");
        card.className = "pend-card" + (cls?" -"+cls:"");
        card.innerHTML = `<div class="body">
            <div class="tt">${x.t.tarea}</div>
            <div class="mt">${x.t.tema || x.t.area} · ${respLabel(x.t.responsable)} · vence ${fmtDate(dueDateOf(x.t))}</div>
          </div>`;
        sec.appendChild(card);
      });
    }
    root.appendChild(sec);
  }

  section("Bloqueadas", bloqueadas, "hazard");
  section("Atrasadas", atrasadas, "hazard");
  section("Por hacer, con fecha próxima", porHacerConFecha, "");

  const backlogTasks = tasks.filter(t=>t.source==="backlog");
  if(backlogTasks.length===0) return; // sin sección PENDIENTES en el Sheet, no se muestra
  const backlogSec = document.createElement("div");
  backlogSec.className = "pend-section";
  backlogSec.innerHTML = `<h3>Backlog sin iniciar (sin fecha ni responsable)<span class="tag-count">${backlogTasks.length}</span></h3>`;
  const grid = document.createElement("div");
  grid.className = "backlog-grid";
  backlogTasks.forEach(t=>{
    const item = document.createElement("div");
    item.className = "backlog-item";
    item.innerHTML = `<div class="bl-area">${t.area}</div>${t.tarea}${t.subfase?`<span class="bl-fase">${t.subfase}</span>`:""}`;
    grid.appendChild(item);
  });
  backlogSec.appendChild(grid);
  root.appendChild(backlogSec);
}

/* =====================================================================
   RENDER: ENTREGABLES
   ===================================================================== */
function renderEntregables(root){
  root.innerHTML = `<div class="view-head"><div>
      <h2 class="cond">Entregables</h2>
      <p class="sub">Documentos, piezas y resultados generados por cada tarea, tomados de la columna de observaciones del plan.</p>
    </div></div>`;

  const withObs = trackedTasks().filter(t=>t.obs || taskLink(t)).sort((a,b)=> (dueDateOf(b)||"0").localeCompare(dueDateOf(a)||"0"));
  const countEl = document.createElement("div");
  countEl.className = "result-count";
  countEl.textContent = withObs.length + " entregables registrados";
  root.appendChild(countEl);

  const grid = document.createElement("div");
  grid.className = "deliv-grid";
  root.appendChild(grid);

  if(withObs.length===0){ grid.innerHTML = `<div class="empty-note">Todavía no hay entregables cargados.</div>`; return; }

  withObs.forEach(t=>{
    const estado = currentEstado(t);
    const link = taskLink(t);
    const row = document.createElement("div");
    row.className = "deliv-row";
    const nameHtml = link
      ? `<a class="deliv-link" href="${toHref(link)}" target="_blank" rel="noopener">${t.obs || link}</a>`
      : (t.obs || "—");
    row.innerHTML = `
      <div class="deliv-icon">E</div>
      <div class="deliv-name">${nameHtml}</div>
      <div class="deliv-task">${t.tarea}</div>
      <div><span class="pill">${estado}</span></div>
      <div class="col-dates"><b>${fmtDate(dueDateOf(t))}</b></div>
    `;
    grid.appendChild(row);
  });
}

/* =====================================================================
   RENDER: NOTAS
   ===================================================================== */
function renderNotas(root){
  root.innerHTML = `<div class="view-head"><div>
      <h2 class="cond">Notas</h2>
      <p class="sub">Objetivo, prioridades del trimestre, y bitácora de decisiones y observaciones del equipo.</p>
    </div></div>`;

  const grid = document.createElement("div");
  grid.className = "notes-grid";
  root.appendChild(grid);

  const left = document.createElement("div");
  left.innerHTML = `
    <div class="strategy-block" style="margin-bottom:0">
      <div class="obj-head"><span class="micro">Objetivo del trimestre</span><p>${OBJETIVO}</p></div>
      <div class="prio-list" style="grid-template-columns:1fr">
        ${PRIORIDADES.map(p=>`<div class="prio-item" style="border-right:none;border-bottom:2px solid var(--ink)">
            <span class="n">Prioridad ${p.n}</span><h4>${p.tt}</h4><p>${p.desc}</p>
          </div>`).join("")}
      </div>
    </div>
  `;
  grid.appendChild(left);

  const right = document.createElement("div");
  right.innerHTML = `
    <div class="note-compose">
      <label class="micro" style="display:block;margin-bottom:8px">Agregar una nota</label>
      <textarea id="note-text" placeholder="Ej: el cliente pidió mover el lanzamiento del brand una semana…"></textarea>
      <div class="row">
        <select id="note-author">${allResponsables().map(r=>`<option value="${r}">${r}</option>`).join("")}</select>
        <button class="btn-primary" id="note-submit">Guardar nota</button>
      </div>
    </div>
    <div id="notes-log"></div>
  `;
  grid.appendChild(right);

  right.querySelector("#note-submit").addEventListener("click", ()=>{
    const ta = right.querySelector("#note-text");
    const author = right.querySelector("#note-author").value;
    const text = ta.value.trim();
    if(!text) return;
    addNote(text, author);
    ta.value = "";
  });

  const log = right.querySelector("#notes-log");
  if(notesState.length===0){
    log.innerHTML = `<div class="empty-note">Todavía no hay notas. Sé el primero en dejar una.</div>`;
  } else {
    notesState.forEach(n=>{
      const d = new Date(n.createdAt);
      const item = document.createElement("div");
      item.className = "note-item";
      item.innerHTML = `<button class="row-delete" aria-label="Eliminar nota">&times;</button><div class="who">${n.author} <span class="when">· ${d.toLocaleDateString("es-AR")} ${d.toLocaleTimeString("es-AR",{hour:'2-digit',minute:'2-digit'})}</span></div><p></p>`;
      item.querySelector("p").textContent = n.text;
      item.querySelector(".row-delete").addEventListener("click", ()=>{
        if(confirm("¿Eliminar esta nota?")) deleteNote(n.id);
      });
      log.appendChild(item);
    });
  }
}

/* =====================================================================

    <div class="field" style="margin-top:16px">
      <label class="flabel">Link del entregable (Drive, Docs, web…)</label>

        <button class="btn-secondary btn-sm" id="link-save">Guardar</button>

    <div class="modal-actions"><button class="btn-danger" id="task-delete">Eliminar tarea</button></div>
  `;

/* =====================================================================
   EXPORTAR A EXCEL (backup .xlsx con el estado actual)
   ===================================================================== */
function buildExportRows(){
  const planRows = trackedTasks().map(t=>{
    const estado = currentEstado(t);
    return {
      "Fase": FASE_META[t.fase] ? FASE_META[t.fase].label : "",
      "Área": t.area || "",
      "Tema": t.tema || "",
      "Tarea": t.tarea,
      "Responsable": respLabel(t.responsable),
      "Inicio": t.inicio || "",
      "Cierre": t.cierre || t.tiempo || "",
      "Estado": estado,
      "Prioridad": urgencia(t, estado),
      "Atrasada": isOverdue(t, estado) ? "Sí" : "No",
      "Link": taskLink(t) || "",
      "Entregable / Obs.": t.obs || "",
    };
  });
  const etapa1Rows = RAW.etapa1.map(e=>({
    "Fecha": e.fecha, "Tarea": e.tarea, "Responsable": e.responsable, "Estado": e.estado, "Resultado": e.resultado || "",
  }));
  const reunionRows = (meetingsState.length ? meetingsState : [{}]).map(m=>({
    "Fecha": m.fecha || "", "Duración": m.duracion || "", "Responsable": m.responsable || "", "Resumen": m.resumen || "",
  }));
  const noteRows = (notesState.length ? notesState : [{}]).map(n=>({
    "Fecha": n.createdAt ? new Date(n.createdAt).toLocaleString("es-AR") : "", "Autor": n.author || "", "Nota": n.text || "",
  }));
  return {planRows, etapa1Rows, reunionRows, noteRows};
}

async function exportToExcel(btn){
  if(typeof XLSX === "undefined"){ alert("El generador de Excel todavía está cargando — probá de nuevo en unos segundos."); return; }
  const original = btn.textContent;
  btn.textContent = "Generando…"; btn.disabled = true;
  try{
    const {planRows, etapa1Rows, reunionRows, noteRows} = buildExportRows();
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(planRows), "Plan de trabajo");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(etapa1Rows), "Etapa 1 - Diagnostico");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(reunionRows), "Reuniones");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(noteRows), "Notas");
    const wbout = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    const blob = new Blob([wbout], {type:"application/octet-stream"});
    const filename = "Weber - Plan de trabajo (backup " + new Date().toISOString().slice(0,10) + ").xlsx";
    const downloads = (window.claude && typeof window.claude.use==="function") ? await window.claude.use("downloads") : null;
    if(!downloads){ alert("La descarga no está disponible en esta vista."); return; }
    await downloads.save({filename, data:blob});
  }catch(e){
    if(!e || e.code!=="declined"){ console.error(e); alert("No se pudo generar el archivo. Probá de nuevo."); }
  }finally{
    btn.textContent = original; btn.disabled = false;
  }
}
document.getElementById("export-btn").addEventListener("click", (e)=> exportToExcel(e.currentTarget));
